user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr '
                    'canary: $http_x_canary_release '
                    'response_time: $request_time';

    access_log /var/log/nginx/access.log main;

    # 基本配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml+rss;

    # 限速配置
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # 后端服务集群 - 支持权重分配
    upstream backend_cluster {
        # 稳定版本实例 - 90%流量
        server backend-stable:8217 weight=90 max_fails=3 fail_timeout=30s;

        # 灰度版本实例 - 10%流量（取消注释启用）
        # server backend-canary:8217 weight=10 max_fails=3 fail_timeout=30s;

        keepalive 64;
    }

    # 灰度版本专用upstream
    upstream backend_canary {
        server backend-canary:8217 max_fails=3 fail_timeout=30s;
    }

    # 前端服务
    upstream frontend {
        server frontend:80 max_fails=3 fail_timeout=30s;
    }

    include /etc/nginx/conf.d/*.conf;
}
