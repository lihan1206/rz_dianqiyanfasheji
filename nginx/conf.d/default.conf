server {
    listen 80;
    server_name _;

    # 健康检查端点
    location /health {
        access_log off;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # API请求路由（灰度发布核心逻辑）
    location /api/ {
        # 策略1: 根据请求Header路由到灰度版本
        if ($http_x_canary_release = "true") {
            proxy_pass http://backend_canary;
            break;
        }

        # 策略2: 根据Cookie路由（用于用户灰度）
        if ($cookie_canary_release = "true") {
            proxy_pass http://backend_canary;
            break;
        }

        # 策略3: 根据IP地址路由（内部测试IP优先使用灰度）
        if ($remote_addr ~* "^192\.168\.|^10\.|^172\.(1[6-9]|2[0-9]|3[01])\.") {
            # 内部IP可直接路由到灰度版本，或按权重分配
            # proxy_pass http://backend_canary;
        }

        # 策略4: 基于用户ID的灰度（需要配合应用层逻辑）
        if ($http_x_user_id ~* "^(1001|1002|1003)$") {
            # 指定用户ID使用灰度版本
            # proxy_pass http://backend_canary;
            # break;
        }

        # 默认路由：按权重分配到集群
        proxy_pass http://backend_cluster;

        # 通用代理配置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Service-Version $service_version;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # 限速
        limit_req zone=api burst=100 nodelay;
        limit_conn conn_limit_per_ip 20;
    }

    # 灰度版本专用入口
    location /canary/ {
        # 设置灰度Cookie
        add_header Set-Cookie "canary_release=true;Path=/;Max-Age=86400;HttpOnly";
        # 重写URL并路由到灰度版本
        rewrite ^/canary(/.*)$ $1 break;
        proxy_pass http://backend_canary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 退出灰度入口
    location /stable/ {
        # 清除灰度Cookie
        add_header Set-Cookie "canary_release=;Path=/;Max-Age=0";
        rewrite ^/stable(/.*)$ $1 break;
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态资源路由
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SPA应用路由支持
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            proxy_pass http://frontend;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Proxy-Cache $upstream_cache_status;
        }
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 隐藏版本信息
    server_tokens off;
}
